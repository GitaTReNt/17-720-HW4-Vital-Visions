<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HW4 | BFSK Receiver</title>
<style>
:root{color-scheme:dark;font:16px/1.45 system-ui;background:#09141f;color:#edf5fc}body{max-width:700px;margin:12px auto;padding:0 14px}h1{font-size:23px;margin:8px 0}p{margin:8px 0}button,select{font:inherit;border:1px solid #355069;border-radius:7px;padding:9px;background:#173141;color:white;margin:4px 2px}button{background:#1b5b61;cursor:pointer}button:disabled{opacity:.5}#panel{background:#142b3c;border-radius:9px;padding:12px;margin:10px 0}#status{font-weight:bold;color:#71e3d0}#detail{font-size:14px;color:#b6c7d5}#output{font-size:21px;margin:8px 0}.success{color:#71e3d0}.failure{color:#ffb68b}#preview{position:relative;width:fit-content;max-width:100%;margin:12px auto;background:black}video{display:block;max-height:48vh;max-width:100%;width:auto;height:auto}#roi{pointer-events:none;position:absolute;left:35%;top:35%;width:30%;height:30%;box-sizing:border-box;border:2px solid #71e3d0}canvas{display:none}.hint{font-size:14px;color:#b6c7d5}
</style>
<body>
<h1>Live Camera Receiver <small>v3</small></h1>
<p class="hint">Keep the green box inside the transmitted image. Confirm the sample count increases, then click Send once on the computer.</p>
<label>Time per bit <select id="symbol"><option value="1">1 s</option><option value="2">2 s</option><option value="0.6666666667">0.667 s</option><option value="0.5">0.5 s</option><option value="0.3333333333">0.333 s</option></select></label>
<button id="start">Start camera and receive</button><button id="stop">Stop</button><button id="save">Save samples (CSV)</button>
<section id="panel" aria-live="polite"><div id="status">Not started</div><div id="detail">Match the transmitter bit duration. Keep this page visible during reception.</div><div id="output">No complete packet received yet</div></section>
<div id="preview"><video id="video" playsinline muted autoplay></video><div id="roi"></div></div>
<canvas id="canvas" width="64" height="64"></canvas>
<script src="receiver_capture.js?v=english3"></script><script src="receiver_runtime.js?v=english3"></script>
</body></html>
